1px;border-radius:2px;display:inline-block}.kr-rut-legend .grad{width:100%;height:10px;border-radius:3px;margin-top:2px}.kr-rut-legend .gl{display:flex;justify-content:space-between;width:100%;font-size:10px;color:#666}.kr-rut-readout{margin-top:9px;font-size:12.5px;line-height:1.45;color:#2c2c2c;border-top:1px solid #eceeed;padding-top:8px}.kr-rut-readout b{color:#0b0b0b}<\/style>","position":"top-left"}},"navigation_control":{"show_compass":true,"show_zoom":true,"visualize_pitch":false,"position":"top-right","orientation":"vertical"},"scale_control":{"position":"bottom-right","unit":"metric","maxWidth":100}},"evals":[],"jsHooks":{"render":[{"code":"function(el, x){\n  (function w(){ var m = el.map; if(!m){ return setTimeout(w, 60); }\n    var wrap = el.querySelector('.kr-rutctrl'); if(!wrap){ return setTimeout(w, 60); }\n    var D = JSON.parse(wrap.dataset.d);\n    var selKom = wrap.querySelector('.kr-rut-kom'), selMatt = wrap.querySelector('.kr-rut-matt'), selPer = wrap.querySelector('.kr-rut-per');\n    var legend = wrap.querySelector('.kr-rut-legend'), readout = wrap.querySelector('.kr-rut-readout');\n    var kom = 'alla', matt = 'dom', per = 'alla';\n    var fmt = function(n){ return Math.round(n).toLocaleString('sv-SE'); };\n    var pct = function(x){ return (x >= 10 ? Math.round(x) : Math.round(x*10)/10).toString().replace('.', ',') + ' procent'; };\n    function domExpr(){ var e = ['match', ['get','dom']]; D.perSlut.forEach(function(s,i){ e.push(s, D.perFarg[i]); }); e.push(D.okFarg); return e; }\n    function klassExpr(){ var e = ['match', ['get','klass']]; D.klassFarg.forEach(function(c,i){ e.push(i, c); }); e.push('#ccc'); return e; }\n    function seq(field, stops, cols){ var e = ['interpolate', ['linear'], ['coalesce', ['get', field], 0]]; stops.forEach(function(s,i){ e.push(s, cols[i]); }); return e; }\n    var GRON = ['#e6f2ec', '#9fd3bd', '#4fae8c', '#00664D', '#00362a'];\n    function paint(){\n      var fs = [];\n      if(kom !== 'alla') fs.push(['==', ['get','kom'], kom]);\n      var color, legendHtml = '';\n      if(per !== 'alla' && matt !== 'klass'){\n        var f = per === 'ok' ? 'pok' : 'p' + per;\n        fs.push(['>', ['get', f], 0]);\n        color = seq(f, [1, 3, 8, 20, 50], GRON);\n        legendHtml = gradLegend('Antal hus i rutan byggda ' + (per === 'ok' ? 'okänt år' : D.perLabels[+per]), ['1', '3', '8', '20', '50+'], GRON);\n      } else if(matt === 'dom'){\n        color = domExpr();\n        legendHtml = D.perLabels.map(function(l,i){ return sw(D.perFarg[i], l); }).join('') + sw(D.okFarg, 'Okänt år');\n      } else if(matt === 'md'){\n        var cols = ['#8c4a2f', '#d68a55', '#d9d2b0', '#5fae9a', '#0b5c5e'];\n        color = seq('md', [1900, 1940, 1970, 2000, 2020], cols);\n        legendHtml = gradLegend('Medianbyggår i rutan', ['1900', '1940', '1970', '2000', '2020'], cols);\n      } else if(matt === 'n'){\n        color = seq('n', [1, 5, 15, 40, 100], GRON);\n        legendHtml = gradLegend('Antal bostadshus per ruta (250 × 250 m)', ['1', '5', '15', '40', '100+'], GRON);\n      } else if(matt === 'a2000'){\n        var c2 = ['#f1efe6', '#b8c9a8', '#5fae9a', '#157f7c', '#0b5c5e'];\n        color = seq('a2000', [0, 25, 50, 75, 100], c2);\n        legendHtml = gradLegend('Andel av rutans hus byggda 2001 eller senare', ['0 %', '25', '50', '75', '100 %'], c2);\n      } else if(matt === 'aff'){\n        var c3 = ['#f1efe6', '#c7c4e3', '#9b95d0', '#6a63b6', '#433C9D'];\n        color = seq('aff', [0, 25, 50, 75, 100], c3);\n        legendHtml = gradLegend('Andel flerfamiljshus av rutans hus', ['0 %', '25', '50', '75', '100 %'], c3);\n      } else {\n        color = klassExpr();\n        legendHtml = D.klassLabels.map(function(l,i){ return sw(D.klassFarg[i], l); }).join('');\n      }\n      m.setFilter('lay-rutor', fs.length ? ['all'].concat(fs) : null);\n      m.setPaintProperty('lay-rutor', 'fill-color', color);\n      var pf = [];\n      if(kom !== 'alla') pf.push(['==', ['get','kom'], kom]);\n      if(per !== 'alla'){ if(per === 'ok') pf.push(['==', ['get','dec'], 0]); else { var s = D.perSlut[+per]; pf.push(['all', ['>', ['get','dec'], 0], ['<=', ['get','dec'], s - 10], ['>', ['get','dec'], (per === '0' ? -1 : s - 20)]]); } }\n      m.setFilter('lay-pts', pf.length ? ['all'].concat(pf) : null);\n      legend.innerHTML = legendHtml;\n      readout.innerHTML = narrative();\n    }\n    function sw(c, l){ return '<span class=\"it\"><span class=\"sw\" style=\"background:' + c + '\"><\/span>' + l + '<\/span>'; }\n    function gradLegend(t, labels, cols){ return '<div style=\"width:100%;font-size:10.5px\">' + t + '<\/div><div class=\"grad\" style=\"background:linear-gradient(90deg,' + cols.join(',') + ')\"><\/div><div class=\"gl\">' + labels.map(function(l){ return '<span>' + l + '<\/span>'; }).join('') + '<\/div>'; }\n    function rows(rk, p){ return D.stat.filter(function(r){ return r.rk === rk && r.per === p; }); }\n    function narrative(){\n      var rk = kom === 'alla' ? '0013' : D.komFull[kom];\n      var namn = kom === 'alla' ? 'Halland' : D.komNamn[kom];\n      var allRows = D.stat.filter(function(r){ return r.rk === rk; });\n      if(!allRows.length) return '';\n      var total = allRows[0].total_region;\n      var share = function(rs, k){ var r = rs.filter(function(z){ return z.klass === k; }); return r.length ? r[0].andel : 0; };\n      if(per === 'alla'){\n        var byK = {}; allRows.forEach(function(r){ byK[r.klass] = (byK[r.klass] || 0) + r.antal; });\n        var tat = 100 * (byK.tatort || 0) / total, sma = 100 * (byK.smaort || 0) / total, fri = 100 * (byK.fritidshus || 0) / total, ut = 100 * (byK.utanfor || 0) / total;\n        var ok = allRows.filter(function(r){ return r.per === 0; }).reduce(function(a,r){ return a + r.antal; }, 0);\n        return '<b>' + fmt(total) + ' bostadshus<\/b> i ' + namn + '. ' + pct(tat) + ' står i en tätort, ' + pct(sma) + ' i en småort' + (fri >= 0.05 ? ', ' + pct(fri) + ' i ett fritidshusområde' : '') + ' och ' + pct(ut) + ' utanför tätort. För ' + pct(100 * ok / total) + ' av husen saknas byggår.';\n      }\n      var p = per === 'ok' ? 0 : D.perSlut[+per];\n      var rs = rows(rk, p);\n      if(!rs.length) return 'Inga hus med den perioden i ' + namn + '.';\n      var n = rs[0].total_dec, fort = rs[0].fortatning_andel;\n      var lbl = per === 'ok' ? 'med okänt byggår' : 'byggda ' + D.perLabels[+per];\n      var t = '<b>' + fmt(n) + ' bostadshus<\/b> ' + lbl + ' i ' + namn + ', ' + pct(100 * n / total) + ' av dagens bestånd. ' + pct(share(rs, 'tatort')) + ' av dem står innanför dagens tätortsgränser och ' + pct(share(rs, 'utanfor')) + ' utanför tätort.';\n      if(fort != null) t += ' ' + pct(fort) + ' restes i rutor som redan var bebyggda före perioden, resten på ny mark.';\n      return t;\n    }\n    function fitTo(bb, dur){ if(bb) m.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: 30, duration: dur == null ? 700 : dur }); }\n    selKom.addEventListener('change', function(){ kom = selKom.value; paint(); fitTo(kom === 'alla' ? D.bbox.alla : D.bbox[kom]); });\n    selMatt.addEventListener('change', function(){ matt = selMatt.value; paint(); });\n    selPer.addEventListener('change', function(){ per = selPer.value; paint(); });\n    if(m.isStyleLoaded()) paint(); else m.on('load', paint);\n    setTimeout(function(){ paint(); fitTo(D.bbox.alla, 0); }, 800);\n  })();\n}","data":null}]}}</script>
